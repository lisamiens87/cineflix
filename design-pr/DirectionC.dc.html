<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Expanded:wght@700;800&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    body{margin:0}
    a{color:#ffffff}a:hover{color:#c9c9c9}
  </style>
</helmet>
<div style="width:390px;height:844px;background:#0b0b0b;color:#fff;font-family:'Archivo',-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:22px 18px 0">
    <div style="font-family:'Archivo Expanded',Archivo,sans-serif;font-weight:800;font-size:15px;letter-spacing:.02em;text-transform:uppercase">Premier Rang</div>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7a7a7a" stroke-width="1.6"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.2-3.8 4-5.6 7.5-5.6s6.3 1.8 7.5 5.6"/></svg>
  </div>

  <div style="display:flex;gap:22px;padding:20px 18px 0;align-items:center">
    <div style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff;padding-bottom:9px;box-shadow:inset 0 -2px 0 #fff">Tout</div>
    <div style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5e5e5e;padding-bottom:9px">Films</div>
    <div style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5e5e5e;padding-bottom:9px">Séries</div>
    <div style="flex:1"></div>
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7a7a7a" stroke-width="1.7" style="margin-bottom:9px"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
  </div>
  <div style="height:1px;background:#232323"></div>

  <div style="padding:22px 18px 0;flex:1;min-height:0">
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px">
      <div style="font-family:'Archivo Expanded',Archivo,sans-serif;font-size:22px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase;line-height:1">À l'affiche</div>
      <div style="font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#5e5e5e;text-transform:uppercase">12</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px">
      <div>
        <div style="aspect-ratio:2/3;border-radius:2px;background:linear-gradient(165deg,#1d3f45,#0d1f23)"></div>
        <div style="font-size:11px;font-weight:700;margin-top:8px;line-height:1.25">Heat</div>
        <div style="font-size:10px;color:#5e5e5e;margin-top:2px">1995</div>
      </div>
      <div>
        <div style="aspect-ratio:2/3;border-radius:2px;background:linear-gradient(165deg,#4a3418,#211709)"></div>
        <div style="font-size:11px;font-weight:700;margin-top:8px;line-height:1.25">Casino</div>
        <div style="font-size:10px;color:#5e5e5e;margin-top:2px">1995</div>
      </div>
      <div>
        <div style="aspect-ratio:2/3;border-radius:2px;background:linear-gradient(165deg,#2b2f52,#121428)"></div>
        <div style="font-size:11px;font-weight:700;margin-top:8px;line-height:1.25">Blade Runner 2049</div>
        <div style="font-size:10px;color:#5e5e5e;margin-top:2px">2017</div>
      </div>
    </div>

    <div style="display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 14px">
      <div style="font-family:'Archivo Expanded',Archivo,sans-serif;font-size:22px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase;line-height:1">Sorties</div>
      <div style="font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#5e5e5e;text-transform:uppercase">08</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px">
      <div>
        <div style="aspect-ratio:2/3;border-radius:2px;background:linear-gradient(165deg,#4a1f26,#210e12)"></div>
        <div style="font-size:11px;font-weight:700;margin-top:8px;line-height:1.25">Dune</div>
        <div style="font-size:10px;color:#5e5e5e;margin-top:2px">2021</div>
      </div>
      <div>
        <div style="aspect-ratio:2/3;border-radius:2px;background:linear-gradient(165deg,#3d4426,#1c1f11)"></div>
        <div style="font-size:11px;font-weight:700;margin-top:8px;line-height:1.25">1917</div>
        <div style="font-size:10px;color:#5e5e5e;margin-top:2px">2019</div>
      </div>
      <div>
        <div style="aspect-ratio:2/3;border-radius:2px;background:linear-gradient(165deg,#3a2b3f,#191220)"></div>
        <div style="font-size:11px;font-weight:700;margin-top:8px;line-height:1.25">Le Parrain</div>
        <div style="font-size:10px;color:#5e5e5e;margin-top:2px">1972</div>
      </div>
    </div>
  </div>

  <div style="border-top:1px solid #232323;padding:11px 0 13px">
    <div style="display:grid;grid-template-columns:repeat(4,1fr)">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="m15.2 8.8-2 5.4-5.4 2 2-5.4z"/></svg>
        <div style="font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#fff">Découvrir</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5e5e5e" stroke-width="1.6"><path d="M12 3.5 13.9 9 19.5 11 13.9 13 12 18.5 10.1 13 4.5 11 10.1 9z"/></svg>
        <div style="font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#5e5e5e">Guide-moi</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5e5e5e" stroke-width="1.6"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4.6-7 9-7 9z"/></svg>
        <div style="font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#5e5e5e">Ma liste</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5e5e5e" stroke-width="1.6"><rect x="3" y="9" width="18" height="11" rx="1"/><path d="m3.6 9 2.6-4.4 3.4 3.6 2.6-4.4 3.4 3.6 2.6-4.4"/></svg>
        <div style="font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#5e5e5e">Cinéma</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
