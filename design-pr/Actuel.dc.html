<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Playfair+Display:wght@700&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    body{margin:0}
    a{color:#ff4d3d}a:hover{color:#ff8d80}
  </style>
</helmet>
<div style="width:390px;height:844px;background:#0b0b0f;color:#e8eaf0;font-family:-apple-system,'Archivo',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;position:relative">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0">
    <div>
      <div style="font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:21px;letter-spacing:.02em">PREMIER RANG</div>
      <div style="width:76px;height:3px;background:#d8a53a;margin-top:6px;border-radius:2px"></div>
    </div>
    <div style="width:38px;height:38px;border-radius:50%;background:#1d1d24;display:grid;place-items:center">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8b92a4" stroke-width="1.7"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.2-3.8 4-5.6 7.5-5.6s6.3 1.8 7.5 5.6"/></svg>
    </div>
  </div>

  <div style="display:flex;gap:10px;padding:16px 16px 0;align-items:center">
    <div style="width:44px;height:38px;border-radius:19px;background:#17171d;display:grid;place-items:center;flex:none">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#e8eaf0" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
    </div>
    <div style="height:38px;padding:0 22px;border-radius:19px;background:#ff4d3d;color:#fff;font-size:14.5px;font-weight:700;display:grid;place-items:center">Tout</div>
    <div style="height:38px;padding:0 20px;border-radius:19px;background:#17171d;color:#c9c9d2;font-size:14.5px;font-weight:600;display:grid;place-items:center">Films</div>
    <div style="height:38px;padding:0 20px;border-radius:19px;background:#17171d;color:#c9c9d2;font-size:14.5px;font-weight:600;display:grid;place-items:center">Séries</div>
  </div>

  <div style="padding:24px 16px 0;flex:1;min-height:0">
    <div style="font-size:15px;font-weight:800;margin-bottom:12px">À l'affiche</div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <div>
        <div style="aspect-ratio:2/3;border-radius:14px;background:linear-gradient(160deg,#1d3f45,#0f2429);border:1px solid #22222a;display:grid;place-items:end start;padding:10px">
          <div style="font-family:'Playfair Display',Georgia,serif;font-size:16px;color:#cfe3e2">Heat</div>
        </div>
        <div style="font-size:13px;font-weight:700;margin-top:7px">Heat</div>
        <div style="font-size:11.5px;color:#8b92a4">1995</div>
      </div>
      <div>
        <div style="aspect-ratio:2/3;border-radius:14px;background:linear-gradient(160deg,#4a3418,#241a0d);border:1px solid #22222a;display:grid;place-items:end start;padding:10px">
          <div style="font-family:'Playfair Display',Georgia,serif;font-size:16px;color:#e8d3ac">Casino</div>
        </div>
        <div style="font-size:13px;font-weight:700;margin-top:7px">Casino</div>
        <div style="font-size:11.5px;color:#8b92a4">1995</div>
      </div>
    </div>
    <div style="font-size:15px;font-weight:800;margin:22px 0 12px">Sorties physiques</div>
    <div style="display:flex;gap:12px">
      <div style="width:92px;aspect-ratio:2/3;border-radius:14px;background:linear-gradient(160deg,#2b2f52,#14162b);border:1px solid #22222a"></div>
      <div style="width:92px;aspect-ratio:2/3;border-radius:14px;background:linear-gradient(160deg,#4a1f26,#241014);border:1px solid #22222a"></div>
      <div style="width:92px;aspect-ratio:2/3;border-radius:14px;background:linear-gradient(160deg,#3d4426,#1e2113);border:1px solid #22222a"></div>
    </div>
  </div>

  <div style="border-top:1px solid #22222a;background:rgba(15,17,21,.97);padding:10px 0 12px">
    <div style="display:grid;grid-template-columns:repeat(4,1fr)">
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px"><div style="font-size:23px;line-height:1">🧭</div><div style="font-size:10.5px;font-weight:600;color:#ff4d3d">Découvrir</div></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px"><div style="font-size:23px;line-height:1">✨</div><div style="font-size:10.5px;font-weight:600;color:#8b92a4">Guide-moi</div></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px"><div style="font-size:23px;line-height:1">❤️</div><div style="font-size:10.5px;font-weight:600;color:#8b92a4">Ma liste</div></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px"><div style="font-size:23px;line-height:1">🎬</div><div style="font-size:10.5px;font-weight:600;color:#8b92a4">Cinéma</div></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
