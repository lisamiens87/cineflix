<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Expanded:wght@700;800&family=Playfair+Display:wght@700&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    body{margin:0}
    a{color:#c6a664}a:hover{color:#dcc08a}
  </style>
</helmet>
<div style="width:390px;height:844px;background:#09090b;color:#ece9e3;font-family:'Archivo',-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <div style="display:flex;align-items:flex-end;justify-content:space-between;padding:20px 20px 0">
    <div style="font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:19px;letter-spacing:.14em;color:#ece9e3">PREMIER RANG</div>
    <div style="width:30px;height:30px;border-radius:50%;border:1px solid #2a2a30;display:grid;place-items:center">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#85838c" stroke-width="1.4"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.2-3.8 4-5.6 7.5-5.6s6.3 1.8 7.5 5.6"/></svg>
    </div>
  </div>

  <div style="display:flex;gap:24px;padding:22px 20px 0;align-items:center">
    <div style="font-family:'Archivo Expanded',Archivo,sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#ece9e3;padding-bottom:8px;box-shadow:inset 0 -1px 0 #c6a664">Tout</div>
    <div style="font-family:'Archivo Expanded',Archivo,sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6d6b74;padding-bottom:8px">Films</div>
    <div style="font-family:'Archivo Expanded',Archivo,sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6d6b74;padding-bottom:8px">Séries</div>
    <div style="flex:1"></div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#85838c" stroke-width="1.5" style="margin-bottom:8px"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
  </div>
  <div style="height:1px;background:#1c1c21;margin:0 20px"></div>

  <div style="padding:26px 20px 0;flex:1;min-height:0">
    <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:16px">
      <div style="font-family:'Archivo Expanded',Archivo,sans-serif;font-size:10.5px;font-weight:800;letter-spacing:.2em;color:#c6a664">01</div>
      <div style="font-family:'Archivo Expanded',Archivo,sans-serif;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#ece9e3">À l'affiche</div>
      <div style="flex:1;height:1px;background:#1c1c21"></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px">
      <div>
        <div style="aspect-ratio:2/3;border-radius:3px;background:linear-gradient(165deg,#1d3f45,#0d1f23);display:grid;place-items:end start;padding:12px;box-shadow:inset 0 0 0 1px rgba(236,233,227,.07)">
          <div style="font-family:'Playfair Display',Georgia,serif;font-size:17px;color:#cfe3e2">Heat</div>
        </div>
        <div style="font-size:12.5px;font-weight:600;margin-top:10px;letter-spacing:.01em">Heat</div>
        <div style="font-size:11px;color:#85838c;letter-spacing:.06em;margin-top:2px">1995 · MICHAEL MANN</div>
      </div>
      <div>
        <div style="aspect-ratio:2/3;border-radius:3px;background:linear-gradient(165deg,#4a3418,#211709);display:grid;place-items:end start;padding:12px;box-shadow:inset 0 0 0 1px rgba(236,233,227,.07)">
          <div style="font-family:'Playfair Display',Georgia,serif;font-size:17px;color:#e8d3ac">Casino</div>
        </div>
        <div style="font-size:12.5px;font-weight:600;margin-top:10px;letter-spacing:.01em">Casino</div>
        <div style="font-size:11px;color:#85838c;letter-spacing:.06em;margin-top:2px">1995 · M. SCORSESE</div>
      </div>
    </div>

    <div style="display:flex;align-items:baseline;gap:12px;margin:28px 0 16px">
      <div style="font-family:'Archivo Expanded',Archivo,sans-serif;font-size:10.5px;font-weight:800;letter-spacing:.2em;color:#c6a664">02</div>
      <div style="font-family:'Archivo Expanded',Archivo,sans-serif;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#ece9e3">Sorties physiques</div>
      <div style="flex:1;height:1px;background:#1c1c21"></div>
    </div>
    <div style="display:flex;gap:14px">
      <div style="width:96px;aspect-ratio:2/3;border-radius:3px;background:linear-gradient(165deg,#2b2f52,#121428);box-shadow:inset 0 0 0 1px rgba(236,233,227,.07)"></div>
      <div style="width:96px;aspect-ratio:2/3;border-radius:3px;background:linear-gradient(165deg,#4a1f26,#210e12);box-shadow:inset 0 0 0 1px rgba(236,233,227,.07)"></div>
      <div style="width:96px;aspect-ratio:2/3;border-radius:3px;background:linear-gradient(165deg,#3d4426,#1c1f11);box-shadow:inset 0 0 0 1px rgba(236,233,227,.07)"></div>
    </div>
  </div>

  <div style="border-top:1px solid #1c1c21;padding:12px 0 14px">
    <div style="display:grid;grid-template-columns:repeat(4,1fr)">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#c6a664" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><path d="m15.2 8.8-2 5.4-5.4 2 2-5.4z"/></svg>
        <div style="font-family:'Archivo Expanded',Archivo,sans-serif;font-size:8.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#c6a664">Découvrir</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6d6b74" stroke-width="1.4"><path d="M12 3.5 13.9 9 19.5 11 13.9 13 12 18.5 10.1 13 4.5 11 10.1 9z"/></svg>
        <div style="font-family:'Archivo Expanded',Archivo,sans-serif;font-size:8.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6d6b74">Guide-moi</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6d6b74" stroke-width="1.4"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4.6-7 9-7 9z"/></svg>
        <div style="font-family:'Archivo Expanded',Archivo,sans-serif;font-size:8.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6d6b74">Ma liste</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6d6b74" stroke-width="1.4"><rect x="3" y="9" width="18" height="11" rx="1"/><path d="m3.6 9 2.6-4.4 3.4 3.6 2.6-4.4 3.4 3.6 2.6-4.4"/></svg>
        <div style="font-family:'Archivo Expanded',Archivo,sans-serif;font-size:8.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6d6b74">Cinéma</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
