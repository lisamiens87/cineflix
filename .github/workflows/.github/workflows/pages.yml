# ===================== Publication de Cinéflix ============================
# Remplace le workflow que GitHub fabriquait tout seul (« pages build and
# deployment »). Un seul changement de fond, mais il est décisif :
#
# L'outil actions/deploy-pages attend que les serveurs Pages disent « publié ».
# Par défaut il abandonne au bout de 10 minutes ET ANNULE la publication en
# cours — même quand elle avançait normalement. Le 06/08 les serveurs Pages
# ont mis plus de 10 minutes : cinq livraisons de suite ont été tuées par ce
# minuteur alors que le paquet était bon (« Canceled deployment with ID … »
# juste après « deployment_in_progress »).
#
# Ici le minuteur passe à 60 minutes. On attend, on n'annule pas.
#
# Second garde-fou : cancel-in-progress reste à false. Quand on pousse
# plusieurs commits d'affilée, chaque nouveau NE tue PAS le déploiement
# précédent — il fait la queue. C'est l'enchaînement de commits qui avait
# embouteillé la file ce jour-là.
# ==========================================================================

name: Publier Cineflix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Preparer Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publier
        id: publication
        uses: actions/deploy-pages@v4
        with:
          timeout: 3600000
          error_count: 20
          reporting_interval: 15000
